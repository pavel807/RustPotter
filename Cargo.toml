[package]
name = "rustpotter"
version = "4.0.0"
edition = "2021"
license = "Apache-2.0"
description = "An open source wakeword spotter forged in rust."
authors = ["Miguel Álvarez Díez <miguelwork92@gmail.com>"]
repository = "https://github.com/pavel807/RustPotter"
exclude = [
    ".vscode/*",
    "tests/*",
    "tools/*",
    "square-icon.png",
]

[dependencies]
candle-core = "0.11.0"
candle-nn = "0.11.0"
ciborium = "0.2.1"
hound = "3.4.5"
rubato = { version = "5.0", default-features = false, features = ["fft_resampler"] }
rustfft = { version = "6.4.1", default-features = false }
serde =  { version = "1.0.188", features = ["derive"], default-features = false }

[features]
default = ["debug"]
debug = []
display = []
audio = []
record = []

